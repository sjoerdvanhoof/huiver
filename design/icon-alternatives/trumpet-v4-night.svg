<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4a45"/>
      <stop offset="1" stop-color="#1a302d"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132422"/>
      <stop offset="1" stop-color="#0a1514"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc95"/>
      <stop offset="1" stop-color="#cf9f47"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c99741"/>
      <stop offset="1" stop-color="#f3d68e"/>
    </linearGradient>
    <radialGradient id="cup" cx="0.6" cy="0.5" r="0.85">
      <stop offset="0" stop-color="#8a5f22"/>
      <stop offset="1" stop-color="#c2913a"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="waterClip"><rect x="0" y="680" width="1024" height="344"/></clipPath>

    <path id="petalShape" d="M0,0 C40,-31 52,-104 0,-172 C-52,-104 -40,-31 0,0 Z"/>

    <g id="head">
      <g transform="scale(0.62,1)" fill="url(#petal)" stroke="#9a6f28" stroke-width="4">
        <use xlink:href="#petalShape" transform="rotate(-90)"/>
        <use xlink:href="#petalShape" transform="rotate(-135)"/>
        <use xlink:href="#petalShape" transform="rotate(135)"/>
        <use xlink:href="#petalShape" transform="rotate(-45)"/>
        <use xlink:href="#petalShape" transform="rotate(45)"/>
        <use xlink:href="#petalShape" transform="rotate(0)"/>
        <use xlink:href="#petalShape" transform="rotate(180)"/>
      </g>
      <ellipse cx="2" cy="0" rx="30" ry="46" fill="url(#petal)" stroke="#9a6f28" stroke-width="4"/>
      <path d="M6,-36 C60,-48 108,-66 148,-92 C160,-99 166,-92 158,-82 L158,82 C166,92 160,99 148,92 C108,66 60,48 6,36 Z"
            fill="url(#bell)" stroke="#9a6f28" stroke-width="4"/>
      <path d="M12,-38 C64,-50 110,-68 146,-88" fill="none" stroke="#f8ecc0" stroke-width="3" opacity="0.7"/>
      <ellipse cx="156" cy="0" rx="30" ry="88" fill="url(#cup)" stroke="#f3d68e" stroke-width="4"/>
      <g fill="none" stroke="#f2d88e" stroke-linecap="round">
        <path d="M163,0 C190,-18 210,-26 232,-30" stroke-width="3.5" opacity="0.95"/>
        <path d="M163,0 C190,16 212,24 236,30" stroke-width="3.5" opacity="0.95"/>
        <path d="M163,0 C230,-52 310,-72 415,-78" stroke-width="3.5" opacity="0.9"/>
        <path d="M163,0 C240,-30 330,-36 448,-30" stroke-width="3.2" opacity="0.75"/>
        <path d="M163,0 C245,4 340,10 460,18" stroke-width="3" opacity="0.62"/>
        <path d="M163,0 C238,36 322,58 430,84" stroke-width="3" opacity="0.5"/>
        <path d="M163,0 C222,62 292,102 372,138" stroke-width="3" opacity="0.42"/>
      </g>
      <g fill="#d9af52">
        <circle cx="232" cy="-30" r="6"/>
        <circle cx="236" cy="30" r="6"/>
        <circle cx="415" cy="-78" r="5.5"/>
        <circle cx="448" cy="-30" r="5.5"/>
        <circle cx="460" cy="18" r="5.5"/>
        <circle cx="430" cy="84" r="5.5"/>
        <circle cx="372" cy="138" r="5.5"/>
      </g>
      <circle cx="162" cy="0" r="9" fill="#f8ecc0"/>
    </g>

    <g id="flowerV4">
      <path d="M410,695 L410,402" fill="none" stroke="#476b45" stroke-width="26" stroke-linecap="round"/>
      <use xlink:href="#head" transform="translate(410,340) rotate(10)"/>
    </g>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect x="0" y="680" width="1024" height="344" fill="url(#water)"/>
  <rect x="0" y="678" width="1024" height="3" fill="#f2d88e" opacity="0.25"/>

  <!-- moonlit glow around the bloom -->
  <ellipse cx="460" cy="350" rx="260" ry="225" fill="#e9c568" opacity="0.3" filter="url(#glow)"/>

  <g clip-path="url(#waterClip)" opacity="0.5">
    <use xlink:href="#flowerV4" transform="translate(0,1360) scale(1,-1)" filter="url(#soft)"/>
  </g>

  <g fill="none" stroke="#e9cd82">
    <ellipse cx="410" cy="708" rx="50" ry="8" opacity="0.4"/>
    <ellipse cx="410" cy="711" rx="100" ry="15" opacity="0.25"/>
    <ellipse cx="740" cy="702" rx="70" ry="11" opacity="0.2"/>
  </g>

  <use xlink:href="#flowerV4"/>
</svg>
