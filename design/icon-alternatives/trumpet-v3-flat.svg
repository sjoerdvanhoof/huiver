        <use xlink:href="#petalShape" transform="rotate(135)"/>
        <use xlink:href="#petalShape" transform="rotate(-45)"/>
        <use xlink:href="#petalShape" transform="rotate(45)"/>
        <use xlink:href="#petalShape" transform="rotate(0)"/>
        <use xlink:href="#petalShape" transform="rotate(180)"/>
      </g>
      <ellipse cx="2" cy="0" rx="30" ry="46" fill="#dfba6b"/>
      <path d="M6,-36 C60,-48 108,-66 148,-92 C160,-99 166,-92 158,-82 L158,82 C166,92 160,99 148,92 C108,66 60,48 6,36 Z" fill="#c08f3a"/>
      <ellipse cx="156" cy="0" rx="30" ry="88" fill="#7e5c22" stroke="#e5c476" stroke-width="5"/>
      <g fill="none" stroke="#e5c476" stroke-linecap="round" stroke-width="7">
